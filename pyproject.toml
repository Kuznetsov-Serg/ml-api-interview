    {name = "Kuznetsov-Serg",email = "ksn1974@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.143.1,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "asyncpq (>=0.44,<0.45)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
